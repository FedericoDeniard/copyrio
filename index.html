<html lang="es">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Copyrio – Imprenta y encuadernación en Buenos Aires. Facturas, recibos, remitos, tarjetas, volantes y más." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap"

      />

    <style>
      /* Size-adjust / ascent-override / descent-override / line-gap-override
         so the fallback font matches the metrics of Geist and avoids CLS on swap. */
      @font-face {
        font-family: "Geist Fallback";
        src: local("Arial");
        ascent-override: 90%;
        descent-override: 22.43%;
        line-gap-override: 0%;
        size-adjust: 107.64%;
      }
      .font-display,
      .font-sans {
        font-family: "Geist", "Geist Fallback", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
